[project]
name = "openfarm"
lane = "farm"
base_branch = "master"
state_dir = "/home/prix/.openfarm/openfarm"

[adapters]
cards = "files:cards/"
runner = "direct"
languages = ["python"]
model = "openai-compatible"
micromanager = "claude-acp"
telemetry = "jsonl"
pack = ""

[model]
endpoint = "https://api.example.invalid/v1"
allowed_endpoints = ["https://api.example.invalid/v1"]
key_file = "/home/prix/.config/openfarm/openfarm.key"
cost_per_1k_in = 0.0005
cost_per_1k_out = 0.0015
test_writer = { model = "lesser-coder", temperature = 0.2 }
implementer = { model = "lesser-coder", temperature = 0.3, vary_seed = true }
checker     = { model = "lesser-coder", temperature = 0.35, vary_seed = true }
planner     = { model = "lesser-coder", temperature = 0.2 }

[policy]
never_touch = [
  # The gates and the pipeline that judge a card: a worker never edits its judge.
  "openfarm_core/gates/**",
  "openfarm_core/flow.py",
  "openfarm_core/protocol.py",
  "openfarm_core/config.py",
  "openfarm_core/edits.py",
  "openfarm_core/git.py",
  "openfarm_core/errors.py",
  "openfarm_core/selfhost.py",
  "openfarm_core/adapters/acp.py",
  "openfarm_core/adapters/claude_native_acp.py",
]
forbidden_files = ["pyproject.toml", ".openfarm/**", ".claude/**"]
known_failing = []
flagged_patterns = ["os.environ[", "time.sleep(", "open("]
categories = [
  "test-backfill",
  "mechanical",
  "pattern",
  "pinned-bugfix",
  "small-feature",
  "feature",
  "refactor",
  "integration",
  "port",
]

[eligibility]
max_files = 6
max_units = 1
require_reference = ["pattern", "small-feature"]
refuse_touches_prefixes = ["seam:"]
python_tests_in_test_files = true
allow_type_changes = true
max_context_files = 8

[brief]
test_conventions = ".openfarm/test-conventions.md"

[runner]
# Empty: the interpreter openfarm itself runs under.
python = ""

[runner.env]

[budget]
implementer_attempts = 3
test_writer_attempts = 2
model_build_calls_per_card = 10
mutation_build_calls_per_card = 40
tokens_per_card = 400_000
wall_clock_per_card = "45m"
frontier_cost_ratio = 0.30
spend_per_night = 20.00
concurrent_builds = 2
concurrent_cards = 3
lease_ttl = "20m"
kill_switch = "/home/prix/.openfarm/openfarm/STOP"

[gates]
revert_check = "required"
mutation = "off"
mutation_required_for = []
mutation_min_kill_rate = 0.8
counter_tests = "report"
coverage = "off"
workspace_lint = true
baseline_cache = true
catch_up = "check"
findings_per_card = 2
circuit_breaker = 3
planner = "auto"

[cards]
fields_block = "toml"
required_fields = []

[micromanager]
mode = "active"
auth = "oauth"
binary = "auto"
args = []
model = ""
effort = "medium"
tool_policy = "none"
timeout_s = 180.0
max_calls_per_card = 4
tokens_per_card = 120_000
spend_per_night = 10.0
cost_per_1k_in = 0.003
cost_per_1k_out = 0.015
isolate_home = true
shape_cards = true
scaffold_contracts = true
coach_on_stall = true
adjudicate_counter_tests = true
pre_review = true

[state]
min_free_mb = 256

[harness]
enabled = true
dir = ""
capture_on = ["retry_recovery", "fail", "counter_fail", "pass"]
max_cues_per_brief = 4
max_active_adaptations = 8
min_confidence = 0.55
probe_window = 3
auto_demote = true
allow_micromanager_reflection = true
editable_surfaces = [
  "test_writer_guidance",
  "implementer_guidance",
  "planner_guidance",
  "context_hints",
  "micromanager_context",
]
