# The solo arm: Antigravity does every worker role itself, through the same
# briefs, edit format and gates, with no supervisor. It uses your Antigravity
# OAuth login over ACP (`agy acp`); no key file. Pass it as --arm solo=<file>.

[adapters]
model = "antigravity-acp"
micromanager = "off"

[model]
max_tokens = 32768
# An empty model name means Antigravity's default model.
test_writer = { model = "", temperature = 0.2 }
implementer = { model = "", temperature = 0.3 }
checker     = { model = "", temperature = 0.35 }
planner     = { model = "", temperature = 0.2 }

# How to reach Antigravity. mode stays "off": in this arm nothing supervises.
[micromanager]
mode = "off"
auth = "oauth"
binary = "auto"
args = []
effort = "medium"
timeout_s = 600.0
isolate_home = true
