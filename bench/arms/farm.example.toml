# The farm arm: cheaper workers on an OpenAI-compatible endpoint, with Claude
# supervising over ACP on your claude.ai login. Copy this file outside the repo,
# fill it in, and pass it as --arm farm=<file>.
#
# An arm file sets only these tables; everything else comes from the task.

[adapters]
model = "openai-compatible"
micromanager = "claude-acp"

[model]
endpoint = "https://api.example.invalid/v1"
allowed_endpoints = ["https://api.example.invalid/v1"]
# Outside any repository, mode 600.
key_file = "/home/you/.config/openfarm/bench.key"
# Whatever header your provider needs for zero data retention and no training,
# for example Command Code's: headers = { "x-cmd-zdr" = "1" }
headers = {}
max_tokens = 32768
cost_per_1k_in = 0.0003
cost_per_1k_out = 0.0012
test_writer = { model = "your-worker-model", temperature = 0.2 }
implementer = { model = "your-worker-model", temperature = 0.3, vary_seed = true }
checker     = { model = "your-worker-model", temperature = 0.35, vary_seed = true }
planner     = { model = "your-worker-model", temperature = 0.2 }

[micromanager]
mode = "active"
auth = "oauth"
binary = "auto"
args = []
model = ""
effort = "medium"
tool_policy = "none"
timeout_s = 600.0
max_calls_per_card = 4
tokens_per_card = 120_000
spend_per_night = 10.0
cost_per_1k_in = 0.003
cost_per_1k_out = 0.015
isolate_home = true
shape_cards = true
scaffold_contracts = true
coach_on_stall = true
adjudicate_counter_tests = true
pre_review = true
