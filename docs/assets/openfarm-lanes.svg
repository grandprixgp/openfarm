<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="604" viewBox="0 0 1280 604" role="img" aria-labelledby="lanes-t lanes-d">
<title id="lanes-t">The three lanes of openfarm</title>
<desc id="lanes-d">Frontier lane: grill and architect pass, decompose or adopt checked cards, inspect live runs via openfarm tui and external swarm/board commands, review dossier and diff, and merge locally. Orchestrator lane: plain Python stdlib running parallel non-colliding cards, append-only board, every gate, BuildLimiter, StallMonitor, and configurable coordinator/supervisor seats. Farm lane: stateless worker roles per tier and effort receiving fenced briefs plus harness cues and returning edit blocks or &lt;&lt;&lt;HANDBACK only.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#17233d"/>
  </linearGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9fb0c8"/>
  </marker>
</defs>
<rect x="0" y="0" width="1280" height="604" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1279" height="603" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="start" >Three lanes, one rule: no model grades its own work</text>
