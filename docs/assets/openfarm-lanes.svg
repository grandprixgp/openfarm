<text x="240" y="204" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b85" text-anchor="start" >Frontier context holds design and review only. Inspect live runs anytime in openfarm tui.</text>
