<text x="310" y="103" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1220" text-anchor="middle">2</text>
<text x="332" y="103" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9" text-anchor="start">Grill &amp; Spec</text>
