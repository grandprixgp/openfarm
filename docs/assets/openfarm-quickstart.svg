<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="206" viewBox="0 0 1280 206" role="img" aria-labelledby="qs-t qs-d">
<title id="qs-t">openfarm quickstart flow</title>
<desc id="qs-d">Five steps from an empty folder and a plain-English idea: 1. Install (Read and install this skill), 2. Initialize (/openfarm-initialize name idea), Validated repo (golden slice, invariants, and checked card queue), and Farm works cards (gated branches and dossiers for you to review and merge).</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#17233d"/>
  </linearGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9fb0c8"/>
  </marker>
</defs>
<rect x="0" y="0" width="1280" height="206" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1279" height="205" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

<text x="40" y="46" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="start">From empty folder to checked card queue</text>

