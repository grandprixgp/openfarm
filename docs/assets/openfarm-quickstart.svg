<path d="M1136,182 L1136,204 L392,204 L392,184" fill="none" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="764" y="199" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#34d399" text-anchor="middle">Iterate: mark chunk done, split next chunk, or start a new feature idea</text>
