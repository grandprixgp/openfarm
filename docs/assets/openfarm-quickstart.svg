<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="224" viewBox="0 0 1280 224" role="img" aria-labelledby="qs-t qs-d">
<title id="qs-t">openfarm v0.14.0 iterative workflow</title>
<desc id="qs-d">Five-stage iterative loop: 1. Idea and Stack (TypeScript/Web, Python, Rust, or Go in an empty folder or existing repo), 2. Grill and Spec (Frontier Architect conversational grill into Living Spec and ordered Chunks), 3. Split into Cards (DAG-ordered cards with baseline tests green and live Architect log), 4. Farm Run (workers run deterministic gates in TUI, detached daemon, or swarm), and 5. Review and Local Land (review in TUI or Tailscale Web Companion, land locally with zero push, and iterate on the next chunk).</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#17233d"/>
  </linearGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9fb0c8"/>
  </marker>
</defs>
<rect x="0" y="0" width="1280" height="224" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1279" height="223" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

<text x="40" y="44" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="start">Idea → Grill → Living Spec &amp; Chunks → Cards → Run → Land → Iterate</text>

