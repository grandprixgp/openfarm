<text x="806" y="103" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1220" text-anchor="middle">4</text>
<text x="828" y="103" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9" text-anchor="start">Farm Run</text>
<text x="888" y="132" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb0c8" text-anchor="middle">Phase A/B + 20+ code gates</text>
