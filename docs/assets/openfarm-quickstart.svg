<text x="62" y="103" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1220" text-anchor="middle">1</text>
<text x="84" y="103" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9" text-anchor="start">Idea &amp; Stack</text>
<text x="144" y="132" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb0c8" text-anchor="middle">TS/Web · Python · Rust · Go</text>
<text x="144" y="153" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">empty folder or existing repo</text>

