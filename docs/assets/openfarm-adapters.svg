<text x="902" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="start">jsonl<tspan fill="#9fb0c8" font-weight="400"> (+ run board &amp; dossiers)</tspan></text>

