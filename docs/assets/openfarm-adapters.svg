<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="404" viewBox="0 0 1280 404" role="img" aria-labelledby="arch-t arch-d">
<title id="arch-t">openfarm core and six adapter interfaces</title>
<desc id="arch-d">openfarm core (Python 3.11+ stdlib, one config file) enforcing gates, budgets, swarm board, and stdlib TUI across six replaceable adapter interfaces: Card source (files: folder on openfarm-cards), Runner (direct cargo, python, node, BuildLimiter, an opt-in bwrap boundary), Language pack (rust, python, typescript), Model backend (openai-compatible, claude/agy/codex-acp, scripted), Telemetry (jsonl plus run board and dossiers), and Micromanager and seats (claude/agy/codex-acp, openfarm drive, tier:&lt;name&gt;, external, off). Every interface also accepts cmd:&lt;argv&gt;.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#17233d"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="404" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1279" height="403" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

<text x="40" y="48" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="start">One portable core, six replaceable adapter interfaces</text>

<rect x="956" y="26" width="284" height="30" rx="15" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.6"/>
<text x="1098" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" fill="#38bdf8" text-anchor="middle">every interface accepts cmd:&lt;argv&gt;</text>

<!-- Center orchestrator hub -->
