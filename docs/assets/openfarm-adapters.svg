<text x="640" y="196" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#f1f5f9" text-anchor="middle">openfarm core</text>
<text x="640" y="225" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb0c8" text-anchor="middle">Python 3.11+ stdlib, one config file</text>
<text x="640" y="248" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="middle">gates, budgets, swarm board + TUI</text>
<rect x="506" y="272" width="268" height="36" rx="10" fill="#0b1220" fill-opacity="0.55" stroke="#fbbf24" stroke-opacity="0.4"/>
<text x="640" y="295" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">{"openfarm": 1, ...} stdio</text>

