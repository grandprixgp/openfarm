<title id="tok-t">openfarm v0.8.5 supervisor token savings</title>
<desc id="tok-d">Left: supervisor prompt characters over the 12 bench tasks with scripted workers, v0.8.1 233,752 characters in 44 calls (pre_review 133,995, reflect_harness 49,102, scaffold_contract 25,777, shape_and_plan 24,878) against v0.8.5 87,814 in 24 calls (pre_review 52,795, shape_and_scaffold 28,541, shape_and_plan 6,478). Right: input tokens of one live shape_and_plan call through openfarm's bridges, full built-in system prompt against the lean one: Claude 4,239 to 1,779, Codex 10,936 to 4,673.</desc>
