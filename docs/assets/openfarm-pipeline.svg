<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="pipeline-t pipeline-d">
<title id="pipeline-t">openfarm per-card pipeline</title>
<desc id="pipeline-d">Eight steps for every card, posted to board.jsonl: 1 claim and eligibility, 2 isolate (parallel when touches are disjoint), 3 baseline green, 4 shape and plan with the contract stubs in one supervisor call, 5 phase A tests, 6 phase B code (retries on max effort or hands back early), 7 end gates including mutation for Rust, Python and TypeScript, 8 catch-up and project plus global harness capture. Ends as a branch with a reviewer dossier or a handed-back/clean block.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#17233d"/>
  </linearGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9fb0c8"/>
  </marker>
</defs>
