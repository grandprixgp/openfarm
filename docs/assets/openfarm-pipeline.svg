<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="pipeline-t pipeline-d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="pipeline-t">openfarm per-card pipeline</title>
<desc id="pipeline-d">Eight steps for every card: 1 claim and eligibility, 2 isolate, 3 baseline green, 4 shape and plan, 5 phase A tests, 6 phase B code, 7 end gates, 8 catch-up and capture. The card ends as a branch with a reviewer dossier, or as a clean block with a note.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#17233d"/>
  </linearGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9fb0c8"/>
  </marker>
</defs>
<rect x="0" y="0" width="1280" height="470" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1279" height="469" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="start" >Every card, every time</text>
<rect x="1000" y="30" width="100" height="26" rx="13.0" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="1050.0" y="45" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle" >run by code</text>
<rect x="1118" y="30" width="93" height="26" rx="13.0" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.6"/>
<text x="1164.5" y="45" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle" >farm model</text>
<rect x="40" y="80" width="282" height="128" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="1.5"/>
<circle cx="70" cy="112" r="15" fill="#fbbf24"/>
<text x="70" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0b1220" text-anchor="middle" >1</text>
<text x="96" y="118" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" >Claim + eligibility</text>
<text x="60" y="158" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >Card hashed and checked</text>
<text x="60" y="179" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >before any model call.</text>
<rect x="346" y="80" width="282" height="128" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="1.5"/>
<circle cx="376" cy="112" r="15" fill="#fbbf24"/>
<text x="376" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0b1220" text-anchor="middle" >2</text>
<text x="402" y="118" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" >Isolate</text>
<text x="366" y="158" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >One branch, one worktree,</text>
<text x="366" y="179" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >one build target per card.</text>
<rect x="652" y="80" width="282" height="128" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="1.5"/>
<circle cx="682" cy="112" r="15" fill="#fbbf24"/>
<text x="682" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0b1220" text-anchor="middle" >3</text>
<text x="708" y="118" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" >Baseline green</text>
<text x="672" y="158" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >Suite runs twice on base;</text>
<text x="672" y="179" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >any disagreement stops it.</text>
<rect x="958" y="80" width="282" height="128" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.75" stroke-width="1.5"/>
<circle cx="988" cy="112" r="15" fill="#34d399"/>
<text x="988" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0b1220" text-anchor="middle" >4</text>
<text x="1014" y="118" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" >Shape + plan</text>
<text x="978" y="158" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >Optional planner splits the</text>
<text x="978" y="179" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >card into checkpointed steps.</text>
<rect x="958" y="248" width="282" height="128" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.75" stroke-width="1.5"/>
<circle cx="988" cy="280" r="15" fill="#34d399"/>
<text x="988" y="285.5" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0b1220" text-anchor="middle" >5</text>
<text x="1014" y="286" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" >Phase A: tests</text>
<text x="978" y="326" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >Named tests must fail on</text>
<text x="978" y="347" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >base, then get frozen by hash.</text>
<rect x="652" y="248" width="282" height="128" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.75" stroke-width="1.5"/>
<circle cx="682" cy="280" r="15" fill="#34d399"/>
<text x="682" y="285.5" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0b1220" text-anchor="middle" >6</text>
<text x="708" y="286" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" >Phase B: code</text>
<text x="672" y="326" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >Edits only listed files,</text>
<text x="672" y="347" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >gated on every attempt.</text>
<rect x="346" y="248" width="282" height="128" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="1.5"/>
<circle cx="376" cy="280" r="15" fill="#fbbf24"/>
<text x="376" y="285.5" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0b1220" text-anchor="middle" >7</text>
<text x="402" y="286" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" >End gates</text>
<text x="366" y="326" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >Revert check, lint, full suite,</text>
<text x="366" y="347" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >checker counter-tests.</text>
<rect x="40" y="248" width="282" height="128" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="1.5"/>
<circle cx="70" cy="280" r="15" fill="#fbbf24"/>
<text x="70" y="285.5" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0b1220" text-anchor="middle" >8</text>
<text x="96" y="286" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" >Catch-up + capture</text>
<text x="60" y="326" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >Trial merge with base; lessons</text>
<text x="60" y="347" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >saved for the next card.</text>
