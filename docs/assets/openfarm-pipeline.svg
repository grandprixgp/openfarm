<text x="40" y="50" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="start" >Every card, every time</text>
<rect x="864" y="30" width="118" height="26" rx="13.0" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.6"/>
