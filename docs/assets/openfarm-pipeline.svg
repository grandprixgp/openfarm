<rect x="994" y="30" width="104" height="26" rx="13.0" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.6"/>
<text x="1046.0" y="47" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle" >run by code</text>
<rect x="1110" y="30" width="130" height="26" rx="13.0" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.6"/>
<text x="1175.0" y="47" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle" >tier + effort role</text>
<rect x="40" y="80" width="282" height="128" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="1.5"/>
<circle cx="70" cy="112" r="15" fill="#fbbf24"/>
<text x="70" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0b1220" text-anchor="middle" >1</text>
<text x="96" y="118" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" >Claim + eligibility</text>
<text x="60" y="158" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >Card hashed and checked</text>
<text x="60" y="179" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start" >before any model call.</text>
<rect x="346" y="80" width="282" height="128" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="1.5"/>
<circle cx="376" cy="112" r="15" fill="#fbbf24"/>
<text x="376" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0b1220" text-anchor="middle" >2</text>
<text x="402" y="118" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" >Isolate</text>
<text x="366" y="158" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb0c8" text-anchor="start" >One branch, worktree + target;</text>
<text x="366" y="179" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb0c8" text-anchor="start" >parallel if touches are disjoint.</text>
<rect x="652" y="80" width="282" height="128" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="1.5"/>
