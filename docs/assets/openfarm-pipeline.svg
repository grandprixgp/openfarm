<text x="183.5" y="425" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#34d399" text-anchor="middle" >Branch + reviewer dossier</text>
<text x="313" y="427" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb0c8" text-anchor="start" >or</text>
<rect x="341" y="408" width="218" height="28" rx="14.0" fill="#94a3b8" fill-opacity="0.14" stroke="#94a3b8" stroke-opacity="0.6"/>
<text x="450.0" y="425" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle" >Clean block, with a note</text>
<text x="579" y="427" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6b85" text-anchor="start" >Both are normal results. Infra failures never spend an attempt.</text>
