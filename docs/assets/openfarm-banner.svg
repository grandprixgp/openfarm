<title id="banner-t">openfarm: Frontier thinks. The farm grinds. Code decides.</title>
<desc id="banner-d">Banner for openfarm v0.14.0, a portable coding factory where frontier models grill ideas into living specs and chunks, worker models run DAG-scheduled cards via TUI, detached daemon, or Tailscale Web Companion, and stdlib Python code enforces every Rust, Python, TypeScript, and Go gate.</desc>
