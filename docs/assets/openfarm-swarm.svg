<text x="60" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="600" fill="#a78bfa" text-anchor="start">code | tier:&lt;name&gt; | external | drive</text>
<text x="60" y="140" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9fb0c8" text-anchor="start">starts cards, sets tier:effort, claude/agy/codex</text>

<rect x="40" y="164" width="330" height="76" rx="12" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.75" stroke-width="1.5"/>
