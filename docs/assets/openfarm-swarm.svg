<text x="60" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="start">claude|agy|codex-acp | tier: | drive | off</text>
<text x="60" y="228" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9fb0c8" text-anchor="start">answers typed board questions read-only</text>

<rect x="40" y="252" width="330" height="76" rx="12" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="1.5"/>
